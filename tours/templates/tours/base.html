<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Конные туры{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 0 auto; padding: 0 16px 40px; }
    nav { padding: 12px 0; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
    nav a, nav button { margin-right: 12px; }
    nav form { display: inline; }
    .msg { background: #e6f4ea; padding: 8px 12px; margin-bottom: 10px; }
    .tag { display: inline-block; background: #eee; padding: 2px 8px; border-radius: 10px; font-size: 13px; }
    .errorlist { color: #b00; }
    .comment { border-bottom: 1px solid #ddd; padding: 8px 0; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'tours:list' %}">Туры</a>
    {% if user.is_authenticated %}
      <a href="{% url 'tours:my_bookings' %}">Мои туры</a>
      <form method="post" action="{% url 'tours:logout' %}">{% csrf_token %}
        <button type="submit">Выйти ({{ user.username }})</button>
      </form>
    {% else %}
      <a href="{% url 'tours:login' %}">Войти</a>
      <a href="{% url 'tours:register' %}">Регистрация</a>
    {% endif %}
  </nav>
  {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
